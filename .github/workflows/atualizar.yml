name: Atualizar provas

on:
  schedule:
    - cron: "17 */3 * * *"  # de 3 em 3 horas (o Athleko só deixa ler algumas páginas de cada vez)
  workflow_dispatch:         # botão "Run workflow" para correr à mão
  push:
    branches: [main]
    paths: ["site/app.html", "scraper/**", "site/data/sources/orioasis.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  recolher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recolher provas
        run: python scraper/run.py

      - name: Guardar dados no repositório
        run: |
          git config user.name "atualizador-provas"
          git config user.email "actions@users.noreply.github.com"
          git add site
          git diff --cached --quiet || git commit -m "Provas atualizadas $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: recolher
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
