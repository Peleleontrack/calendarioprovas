name: Atualizar provas

on:
  schedule:
    - cron: "17 */3 * * *"  # de 3 em 3 horas (o Athleko só deixa ler algumas páginas de cada vez)
  workflow_dispatch:         # botão "Run workflow" para correr à mão

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  recolher:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recolher provas e gravar no Supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::Falta a variável SUPABASE_URL ou o segredo SUPABASE_SERVICE_KEY (ver README)."
            exit 1
          fi
          python scraper/run.py
